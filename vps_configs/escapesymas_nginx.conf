# Escapes y Más - Configuración Nginx Frontend React

# Proxy API y WooCommerce
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Evitar Caching de index.html para asegurar actualizaciones en vivo
location = /index.html {
    root /var/www/vhosts/escapesymas.com/httpdocs;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
    try_files $uri =404;
}

# Caching Avanzado de Archivos Estáticos (WPO)
location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    root /var/www/vhosts/escapesymas.com/httpdocs;
    expires 365d;
    log_not_found off;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    
    # Compresión de Texto sobre Nginx (Gzip)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    try_files $uri =404;
}
