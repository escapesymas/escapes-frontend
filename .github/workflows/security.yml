name: Security

on:
  push:
    # mejoras/**: comprobar antes de pasar a main (main despliega en Coolify).
    branches: [main, 'mejoras/**']
  schedule:
    # Cada domingo a las 00:00 UTC: avisos nuevos en librerías aunque no haya cambios.
    - cron: '0 0 * * 0'
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (solo secretos verificados)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      # Solo las dependencias que llegan a producción; falla con vulnerabilidades altas o críticas.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
