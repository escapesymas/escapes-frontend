name: CI — Escapes Frontend

on:
  push:
    # mejoras/**: comprobar antes de pasar a main (main despliega en Coolify).
    branches: [ main, master, 'mejoras/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # El push a main despliega en Coolify: tipos y lint tienen que pasar antes.
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
