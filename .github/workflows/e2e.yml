name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: E2EdbPass123!
          POSTGRES_DB: escapes_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:E2EdbPass123!@localhost:5432/escapes_db
      JWT_SECRET: e2e-test-secret
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: FRONTEND
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: FRONTEND
        run: pnpm exec playwright install --with-deps chromium

      - name: Run backend schema + migrations + seed test data
        working-directory: FRONTEND
        env:
          E2E_DATABASE_URL: postgresql://postgres:E2EdbPass123!@localhost:5432/escapes_db
        run: |
          PGPASSWORD=E2EdbPass123! psql -h localhost -U postgres -d escapes_db -f ../.gstack/plans/sql/schema-base.sql
          PGPASSWORD=E2EdbPass123! psql -h localhost -U postgres -d escapes_db -f ../.gstack/plans/sql/reviews-migration.sql
          PGPASSWORD=E2EdbPass123! psql -h localhost -U postgres -d escapes_db -f ../.gstack/plans/sql/cart-abandoned-migration.sql

      - name: Build backend
        working-directory: server
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Seed test data (bcrypt user + 5 products)
        working-directory: server
        env:
          E2E_DATABASE_URL: postgresql://postgres:E2EdbPass123!@localhost:5432/escapes_db
        run: |
          DATABASE_URL=${{ env.E2E_DATABASE_URL }} node -e "
            const {Pool}=require('pg');
            const bcrypt=require('bcrypt');
            (async()=>{
              const pool=new Pool({connectionString:process.env.DATABASE_URL});
              const h=await bcrypt.hash('E2ETestPass123!',10);
              await pool.query(\"DELETE FROM products WHERE sku LIKE 'E2E-%'\");
              await pool.query(\"DELETE FROM users WHERE email='e2e-test@escapesymas.com'\");
              await pool.query(\"INSERT INTO users (username,email,first_name,last_name,password_hash,role,billing,garage,cart,created_at,updated_at) VALUES ('e2e_test_user','e2e-test@escapesymas.com','E2E','Tester',\$1,'customer','{}','[]','{}',NOW(),NOW()) ON CONFLICT (email) DO NOTHING\",[h]);
              const products=[['E2E-001','Filtro de aire E2E Test','E2E Brand',1999,50],['E2E-002','Pastillas de freno E2E Test','E2E Brand',4598,20],['E2E-003','Aceite motor E2E Test','E2E Brand',1199,100],['E2E-004','Casco E2E Test','E2E Brand',8999,5],['E2E-005','Escape E2E Test','E2E Brand',15999,0]];
              for(const [sku,name,brand,price,stock] of products){
                await pool.query(\"INSERT INTO products (sku,name,brand,price,stock,status,images,attributes,created_at,updated_at) VALUES (\$1,\$2,\$3,\$4,\$5,'published','[]'::jsonb,'{}'::jsonb,NOW(),NOW()) ON CONFLICT (sku) DO NOTHING\",[sku,name,brand,price,stock]);
              }
              await pool.end();
              console.log('Seeded:',products.length,'products + 1 user');
            })();
          "

      - name: Start backend (test server)
        working-directory: server
        run: |
          DATABASE_URL=${{ env.DATABASE_URL }} JWT_SECRET=${{ env.JWT_SECRET }} \
          SMTP_HOST=localhost SMTP_PORT=2525 \
          STRIPE_SECRET_KEY=sk_test_fake \
          PORT=3001 \
          nohup node index.js > /tmp/backend.log 2>&1 &
          sleep 8
          curl -sf http://localhost:3001/api/health || (cat /tmp/backend.log; exit 1)

      - name: Build frontend
        working-directory: FRONTEND
        run: pnpm run build

      - name: Run E2E tests against local server
        working-directory: FRONTEND
        env:
          E2E_NO_SERVER: '1'
          E2E_API_BASE: http://localhost:3001/api
        run: pnpm exec playwright test --reporter=list

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FRONTEND/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: FRONTEND/test-results/
          retention-days: 7
