name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: E2EdbPass123!
          POSTGRES_DB: escapes_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:E2EdbPass123!@localhost:5432/escapes_db
      JWT_SECRET: e2e-test-secret
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: FRONTEND
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: FRONTEND
        run: pnpm exec playwright install --with-deps chromium

      - name: Run backend migrations + seed test data
        working-directory: FRONTEND
        env:
          E2E_DATABASE_URL: postgresql://postgres:E2EdbPass123!@localhost:5432/escapes_db
        run: |
          PGPASSWORD=E2EdbPass123! psql -h localhost -U postgres -d escapes_db -f ../.gstack/plans/sql/reviews-migration.sql || true
          PGPASSWORD=E2EdbPass123! psql -h localhost -U postgres -d escapes_db -c "INSERT INTO products (sku, name, brand, price, stock, status, images, attributes, created_at, updated_at) VALUES ('E2E-001', 'Filtro aire E2E', 'E2E', 1999, 50, 'published', '[]'::jsonb, '{}'::jsonb, NOW(), NOW()) ON CONFLICT (sku) DO NOTHING;"
          PGPASSWORD=E2EdbPass123! psql -h localhost -U postgres -d escapes_db -c "INSERT INTO products (sku, name, brand, price, stock, status, images, attributes, created_at, updated_at) VALUES ('E2E-002', 'Pastillas freno E2E', 'E2E', 4598, 20, 'published', '[]'::jsonb, '{}'::jsonb, NOW(), NOW()) ON CONFLICT (sku) DO NOTHING;"

      - name: Build backend
        working-directory: server
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Start backend (test server)
        working-directory: server
        run: |
          DATABASE_URL=${{ env.DATABASE_URL }} JWT_SECRET=${{ env.JWT_SECRET }} \
          SMTP_HOST=localhost SMTP_PORT=2525 \
          STRIPE_SECRET_KEY=sk_test_fake \
          PORT=3001 \
          nohup node index.js > /tmp/backend.log 2>&1 &
          sleep 8
          curl -sf http://localhost:3001/api/health || (cat /tmp/backend.log; exit 1)

      - name: Build frontend
        working-directory: FRONTEND
        run: pnpm run build

      - name: Run E2E tests against local server
        working-directory: FRONTEND
        env:
          E2E_NO_SERVER: '1'
          E2E_API_BASE: http://localhost:3001/api
        run: pnpm exec playwright test --reporter=list

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FRONTEND/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: FRONTEND/test-results/
          retention-days: 7
