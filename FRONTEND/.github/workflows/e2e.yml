name: E2E Tests

# Runs the Playwright suite against an ephemeral deploy of the backend
# + frontend. Triggers on push to main and pull requests touching the
# frontend or backend source. Skips when only docs are changed.
#
# Architecture:
#   1. postgres:16 service container, seeded with a minimal catalogue
#   2. backend: Express boots against the in-CI Postgres
#   3. frontend: `next build` + `next start` (Playwright's webServer
#      auto-wires it via playwright.config.ts)
#   4. Playwright runs the e2e/ specs against http://127.0.0.1:3100
#   5. Artifacts (traces, screenshots, video) uploaded on failure

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: '1'
      # Tell the frontend to talk to the backend in CI, not production.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      # Backend runtime config: ephemeral Postgres + minimal SMTP stub.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escapes_test
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_ALLOW_UNSECURE: 'true'
      JWT_SECRET: test-jwt-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escapes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed Postgres schema
        run: |
          # Apply the standalone migrations (each is an `npx tsx` runner).
          # We clone the backend into a sibling checkout for the migration
          # files only — no backend deps are needed beyond pg.
          git clone --depth 1 https://github.com/escapesymas/escapes-backend.git /tmp/backend
          cd /tmp/backend
          for m in 001_schema 002_initial_data 003_add_universal_indexes 004_stripe_webhook 005_email_queue; do
            if [ -f "migrations/${m}.ts" ]; then
              DATABASE_URL=$DATABASE_URL pnpm exec tsx "migrations/${m}.ts" || \
              DATABASE_URL=$DATABASE_URL npx tsx "migrations/${m}.ts"
            fi
          done

      - name: Start backend
        run: |
          cd /tmp/backend
          npm install --omit=dev --no-audit --no-fund
          DATABASE_URL=$DATABASE_URL npx tsx index.ts &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID"
          # Wait for /api/health
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
            echo "Backend failed to start"
            kill $BACKEND_PID 2>/dev/null || true
            exit 1
          fi

      - name: Build frontend
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
