    <meta property="og:url" content="https://www.escapesymas.com/">

    <meta property="og:description" content="El mayor catálogo de escapes, filtros y recambios técnicos para maximizar el rendimiento en pista y carretera.">
    
    <!-- LCP OPTIMIZATION: Exact Match Preloads for App.tsx Logic -->
    <!-- Mobile: 600x800, quality 75 -->

    <!-- Desktop: 1920, quality 80 -->
    <link rel="preload" as="image" href="https://wsrv.nl/?url=https%3A%2F%2Fimages.unsplash.com%2Fphoto-1591637333184-19aa84b3e01f%3Fq%3D80%26w%3D1920%26auto%3Dformat%26fit%3Dcrop&w=1920&output=webp&q=80" media="(min-width: 769px)" fetchpriority="high" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- TAILWIND CDN: Required to fix aesthetics immediately. Using inline config to ensure theme colors load. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              racing: {
                red: '#DC2626',
                orange: '#EA580C',
                black: '#09090b', // Zinc 950
                carbon: '#18181b', // Zinc 900
                asphalt: '#27272a', // Zinc 800
                metal: '#a1a1aa', // Zinc 400
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'fade-in-right': 'fadeInRight 0.3s ease-out forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInRight: {
                '0%': { opacity: '0', transform: 'translateX(100%)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
